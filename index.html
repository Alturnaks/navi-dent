<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navi Dent Alfarabi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 50px 40px;
      max-width: 400px;
      text-align: center;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .links {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .link-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      color: white;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }

    .link-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    .link-btn:active {
      transform: translateY(-2px);
    }

    .instagram-btn {
      background: linear-gradient(135deg, #f093fb 0%, #f5871d 100%);
    }

    .whatsapp-btn {
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
    }

    .icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    footer {
      margin-top: 40px;
      color: #999;
      font-size: 13px;
    }

    .footer-link {
      color: #999;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-link:hover {
      color: #667eea;
    }

    .footer-icon {
      font-size: 13px;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🦷</div>
    <h1>Navi Dent</h1>
    <p class="subtitle">Alfarabi</p>
    
    <div class="links">
      <a href="https://www.instagram.com/navi_dent_alfarabi?stkn=czg2eHd6Z2pmN3ht&utm_source=qr" target="_blank" class="link-btn instagram-btn">
        <div class="icon">📷</div>
        <div class="label">Instagram</div>
      </a>
      
      <a href="http://wa.me/77785630413" target="_blank" class="link-btn whatsapp-btn">
        <div class="icon">💬</div>
        <div class="label">WhatsApp</div>
      </a>
    </div>
    
    <footer>
      <p><span class="footer-icon">✈️</span><a href="https://t.me/Altrx" target="_blank" class="footer-link">made by Altrx</a></p>
    </footer>
  </div>
</body>
</html>
